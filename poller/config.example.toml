# Burnrate configuration. Copy to config.toml (never committed) and fill in your ids.
# A service is on when its section is here; delete a section to turn that service off.

[poller]
interval_minutes = 15
db_path = "burnrate.db"
# 127.0.0.1 keeps the API on this machine. On a server, use its Tailscale IP.
# Listening on every interface (0.0.0.0) is refused on purpose.
listen = "127.0.0.1:8787"
warn_at = 0.80
warn_clear = 0.75
crit_clear = 0.95
# Consecutive failed polls before a "collector failing" alert.
fail_alert_after = 4

[neon]
project_id = "your-neon-project-id"
[neon.limits]
compute_cu_hours = 100
transfer_gb = 5
storage_gb = 0.5

[clerk]
[clerk.limits]
users = 50000

[vercel]
[vercel.limits]
deploys_24h = 100

[oracle]
# "instance_principal" on the Oracle VM itself (no key on disk); "config_file" elsewhere,
# which reads ~/.oci/config.
auth = "instance_principal"
# The compartment that contains the instance; the tenancy OCID if you never created compartments.
compartment_id = "ocid1.tenancy.oc1..your-tenancy-or-compartment"
instance_id = "ocid1.instance.oc1.your-region.your-instance"
# Link speed for the network percentage. A1 gets 1 Gbps per OCPU: set this to your OCPU count.
network_gbps = 1
[oracle.limits]
idle_guard = 20
cpu_p95 = 20
memory = 20
network = 20
outbound_tb = 10
